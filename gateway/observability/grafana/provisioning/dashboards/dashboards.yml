apiVersion: 1

# The dashboards in gateway/observability/grafana/dashboards, as code: edit the
# JSON there, not in the UI (changes made in the UI aren't kept).
providers:
  - name: llm-gateway
    folder: LLM gateway
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
