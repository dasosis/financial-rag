# Financial Report Q&A Engine
#
#   docker compose run --rm ingest   # one-off: embed the filings in data/ into the store
#   docker compose up                # app on http://localhost (via Caddy)
#
# PDFs uploaded through the UI are saved to ./data/users/<id>/ and indexed on
# the spot; filings placed directly in ./data are public samples every user sees.
#
# Caddy is the only service reachable from outside the host. Set SITE_ADDRESS
# in .env to a public hostname (e.g. 3-106-84-6.sslip.io) and Caddy obtains an
# HTTPS certificate for it automatically; unset, it serves plain HTTP on :80.
#
# The vector store lives in the named volume `chroma-data`, so it survives
# rebuilds and restarts. Re-run the ingest job after changing chunking.

services:
  api:
    build: .
    env_file: .env                     # OPENAI_API_KEY, COGNITO_ISSUER, COGNITO_CLIENT_ID
    environment:
      # 1 = trust X-User-Id (local mode, no login). Never on a public host: there
      # the API verifies each request's Cognito ID token instead.
      AUTH_DISABLED: ${AUTH_DISABLED:-0}
    ports:
      # Loopback only: the API trusts the X-User-Id header, so it must never
      # be reachable from outside. Published here just for local debugging.
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma-data:/app/chroma_db
      # Writable: uploads are saved here, so the ingest job can rebuild from them
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ui:
    build: .
    command: streamlit run financial_rag/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    environment:
      # Inside the compose network the API is reachable by service name,
      # not localhost. app.py reads this; defaults to localhost outside Docker.
      API_BASE_URL: http://api:8000
      # 1 = no login, everyone is the single "local" user. Never on a public host.
      AUTH_DISABLED: ${AUTH_DISABLED:-0}
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      # Login config (Cognito client secret, cookie secret) - kept out of the image
      - ./.streamlit:/app/.streamlit:ro
    depends_on:
      api:
        condition: service_healthy

  proxy:
    image: caddy:2.10.0
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data               # certificates; keep them across restarts
    depends_on:
      - ui

  # Optional trace store and viewer for tracing.py, excluded from `up` by its profile.
  # Start it with `docker compose --profile tracing up -d` and set
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 in .env. Traces are kept in
  # memory (capped, so it can't starve the app) and the UI listens on the host's
  # loopback only: `ssh -L 16686:localhost:16686 <host>`, then http://localhost:16686.
  jaeger:
    profiles: ["tracing"]
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "127.0.0.1:16686:16686"
    mem_limit: 300m

  # The LLM gateway (gateway/), excluded from `up` by its profile: three replicas
  # behind an internal load balancer, between the API and the model providers.
  # Start it with `docker compose --profile gateway up -d`, and point the API at
  # it in .env: LLM_GATEWAY_URL=http://llm-gateway:8080/v1 and LLM_GATEWAY_KEY.
  # The provider keys go in .env.gateway, which only the gateway reads, so the
  # OpenAI key no longer has to be in the API's .env. Nothing here is published
  # to the host. See the README's "LLM gateway" section.
  llm-gateway:
    profiles: ["gateway"]
    image: caddy:2.10.0
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [llm-gateway-1, llm-gateway-2, llm-gateway-3]
    mem_limit: 40m
    restart: unless-stopped

  # The replicas' shared rate limits and daily budgets. noeviction: a limit
  # Redis dropped to make room would let calls through. The append-only file
  # keeps today's budgets across a restart.
  llm-gateway-limits:
    profiles: ["gateway"]
    image: redis:7.4.1-alpine
    command: ["redis-server", "--maxmemory", "16mb", "--maxmemory-policy", "noeviction",
              "--appendonly", "yes", "--save", ""]
    volumes:
      - gateway-limits:/data
    mem_limit: 32m
    restart: unless-stopped

  # The response cache: exact repeats of temperature-0 calls (see gateway/README.md).
  # A separate Redis, because this one evicts (allkeys-lru, 64 MB) and the limits
  # must never; entries also expire after 7 days. Nothing is persisted: it's a cache.
  llm-gateway-cache:
    profiles: ["gateway"]
    image: redis:7.4.1-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru",
              "--appendonly", "no", "--save", ""]
    mem_limit: 96m
    restart: unless-stopped

  llm-gateway-1: &llm-gateway
    profiles: ["gateway"]
    build: ./gateway
    image: financial-rag-llm-gateway
    env_file:
      - path: .env.gateway             # OPENAI_API_KEY (and later the backup provider's)
        required: false                # the gateway refuses to start without its keys
    environment:
      LLM_GATEWAY_KEY: ${LLM_GATEWAY_KEY:-}
      GATEWAY_LIMITS_REDIS_URL: redis://llm-gateway-limits:6379/0
      GATEWAY_CACHE_REDIS_URL: redis://llm-gateway-cache:6379/0
      GATEWAY_REPLICAS: "3"            # without Redis, each keeps a third of the limits
      GOMEMLIMIT: 30MiB                # collect garbage before mem_limit is near
    depends_on: [llm-gateway-limits, llm-gateway-cache]
    healthcheck:
      test: ["CMD", "/gateway", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 40m
    restart: unless-stopped

  llm-gateway-2: *llm-gateway
  llm-gateway-3: *llm-gateway

  # One-shot job, excluded from `docker compose up` by its profile.
  # PDFs are bind-mounted read-only from ./data on the host.
  ingest:
    profiles: ["tools"]
    build: .
    command: python -m financial_rag.ingest
    env_file: .env
    volumes:
      - chroma-data:/app/chroma_db
      - ./data:/app/data:ro

volumes:
  chroma-data:
  caddy-data:
  gateway-limits:                      # the gateway profile's rate limits and budgets
